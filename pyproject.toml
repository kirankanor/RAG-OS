[project]
name = "rag-os"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "sqlmodel>=0.0.47",
    "streamlit>=1.64.0",
]

[project.scripts]
rag-os = "rag_os:main"

[project.optional-dependencies]
local = [
    "faiss-cpu>=1.15.1",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]
cloud = [
    "cohere>=7.1.1",
    "openai>=3.19.2",
    "qdrant-client>=1.19.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
